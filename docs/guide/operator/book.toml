# Read by mdBook in CI (make docs); GitBook ignores this file.
[book]
title = "memors-mcp operator guide"
description = "Install, configure, tune, monitor and operate memors-mcp."
authors = ["memors-mcp contributors"]
language = "en"
src = "."

[build]
build-dir = "../../../site/operator"
create-missing = false

[output.html]
git-repository-url = "https://github.com/kKEo/memors"
edit-url-template = "https://github.com/kKEo/memors/edit/master/docs/guide/operator/{path}"
site-url = "/memors/operator/"

[output.html.search]
enable = true
