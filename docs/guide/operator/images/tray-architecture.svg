<text class="xs t2" x="38" y="51">Install step only; checksum verified</text>
<path class="ln dash" d="M148,59 V81" marker-end="url(#an)"/>

<!-- memo-tray -->
<rect class="green" x="24" y="84" width="248" height="216" rx="12"/>
<text class="h lg tg" x="40" y="109">memo-tray</text>
<text class="xs t2" x="118" y="109">macOS menu-bar app</text>
<rect class="box" x="36" y="122" width="224" height="38" rx="8"/>
<text class="s h" x="48" y="138">Menu bar</text>
<text class="xs t2" x="48" y="152">servers and their agents ● ○</text>
<rect class="box" x="36" y="166" width="224" height="38" rx="8"/>
<text class="s h" x="48" y="182">Stats window</text>
<text class="xs t2" x="48" y="196">the Live page, logged in</text>
<rect class="box" x="36" y="210" width="224" height="38" rx="8"/>
<text class="s h" x="48" y="226">Setup and settings</text>
<text class="xs t2" x="48" y="240">pages it serves on 127.0.0.1</text>
<rect class="box" x="36" y="254" width="224" height="38" rx="8"/>
<text class="s h" x="48" y="270">Supervisor</text>
<text class="xs t2" x="48" y="284">starts and stops servers</text>

<!-- clients -->
<rect class="blue" x="488" y="20" width="116" height="38" rx="9"/>
<text class="s" x="546" y="43" text-anchor="middle">Claude Code</text>
<rect class="blue" x="620" y="20" width="116" height="38" rx="9"/>
<text class="s" x="678" y="43" text-anchor="middle">Cursor</text>
<path class="ln" d="M546,59 V81" marker-end="url(#an)"/>
<path class="ln" d="M678,59 V81" marker-end="url(#an)"/>
<text class="xs t3" x="612" y="74" text-anchor="middle">/mcp</text>

<!-- servers -->
<rect class="box" x="488" y="84" width="248" height="86" rx="12"/>
<text class="s h mono tg" x="502" y="106">memo-mcp serve --http</text>
<text class="xs mono t2" x="502" y="124">work · 127.0.0.1:8770</text>
<text class="xs t3" x="502" y="142">started in a terminal</text>
<text class="xs t3" x="502" y="158">memo-tray stops it with SIGTERM only</text>

<rect class="box" x="488" y="204" width="248" height="86" rx="12"/>
<text class="s h mono tg" x="502" y="226">memo-mcp serve --http</text>
<text class="xs mono t2" x="502" y="244">crportal · 127.0.0.1:8765</text>
<text class="xs t3" x="502" y="262">started by memo-tray</text>
<text class="xs t3" x="502" y="278">stop: SIGTERM, SIGKILL after 10 s</text>

<!-- memo-tray to servers -->
<text class="xs mono t2" x="284" y="142">GET /live.json · 2 s</text>
<text class="xs mono t2" x="284" y="158">POST /login-link</text>
<text class="xs t2" x="284" y="174">start · stop</text>
<path class="ln" d="M273,190 H460 M460,127 V247"/>
<path class="ln" d="M460,127 H485" marker-end="url(#an)"/>
<path class="ln" d="M460,247 H485" marker-end="url(#an)"/>

<!-- files -->
<text class="cap t3" x="24" y="322">$MEMO_HOME</text>
<path class="ln" d="M148,302 V328" marker-start="url(#an)" marker-end="url(#an)"/>
<path class="ln" d="M240,302 L322,328" marker-end="url(#an)"/>
<text class="xs t3" x="300" y="310">scans</text>
<path class="ln" d="M540,292 L452,328" marker-end="url(#an)"/>
<text class="xs t3" x="502" y="318">writes</text>
<path class="ln" d="M672,292 V328" marker-end="url(#an)"/>

<rect class="gray" x="24" y="330" width="232" height="46" rx="9"/>
<text class="s h mono" x="38" y="349">tray.json</text>
<text class="xs t2" x="38" y="366">settings; the window edits them</text>
<rect class="gray" x="264" y="330" width="232" height="46" rx="9"/>
<text class="s h mono" x="278" y="349">run/serve-&lt;pid&gt;.json</text>
<text class="xs t2" x="278" y="366">one per running server</text>
<rect class="gray" x="504" y="330" width="232" height="46" rx="9"/>
<text class="s h mono" x="518" y="349">logs/serve-&lt;kb&gt;.log</text>
<text class="xs t2" x="518" y="366">output of the servers it started</text>
</svg>
