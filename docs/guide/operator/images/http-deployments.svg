<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" role="img" aria-labelledby="t d">
<title id="t">Ways to run memors-mcp serve --http</title>
<desc id="d">Four setups. Loopback, the default: only this machine connects and no auth is required; --auth token keeps other OS users out. Behind a reverse proxy: the proxy terminates TLS and forwards to a loopback --http; token auth, needs --public-url. Remote with TLS on the server: --allow-remote with a certificate and --public-url; token auth. Mutual TLS: clients present a certificate signed by --tls-client-ca; the token is optional. The server refuses to expose the knowledge base without authentication or to send the token unencrypted.</desc>
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#171a1f}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.h{font-weight:600}.lg{font-size:14px}.s{font-size:12px}.xs{font-size:11px}.cap{font-size:10.5px;font-weight:600;letter-spacing:.08em}
.t2{fill:#4a4f57}.t3{fill:#6d727a}.tg{fill:#1f5c4f}.tc{fill:#8a4a24}.tb{fill:#36577a}.tw{fill:#fff}
.bg{fill:#faf8f4;stroke:#e4e0d8}.bgk{fill:#faf8f4}.box{fill:#fff;stroke:#d3cec4}.gray{fill:#f3f0ea;stroke:#d3cec4}.sep{fill:none;stroke:#e4e0d8}
.green{fill:#eef5f2;stroke:#3b8572}.clay{fill:#fbf1ea;stroke:#a85a2c}.blue{fill:#eef3f8;stroke:#5b7ea3}
.fg{fill:#3b8572}.fc{fill:#b8693a}.fb{fill:#5b7ea3}.fn{fill:#c4c8cc}
.zone{fill:none;stroke:#7fb3a3;stroke-width:1.5;stroke-dasharray:6 5}.zonec{fill:none;stroke:#d0a080;stroke-width:1.5;stroke-dasharray:6 5}
.ln{fill:none;stroke:#8a8f96;stroke-width:1.5}.lgn{fill:none;stroke:#3b8572;stroke-width:1.5}.lcl{fill:none;stroke:#a85a2c;stroke-width:1.5}.lbl{fill:none;stroke:#5b7ea3;stroke-width:1.5}
.dash{stroke-dasharray:4 4}
.an{fill:#8a8f96}.ag{fill:#3b8572}.ac{fill:#a85a2c}.ab{fill:#5b7ea3}
.ig,.ic,.ib,.in{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ig{stroke:#1f5c4f}.ic{stroke:#a85a2c}.ib{stroke:#36577a}.in{stroke:#4a4f57}
@media (prefers-color-scheme:dark){
text{fill:#eceeec}
.t2{fill:#b4bab7}.t3{fill:#8a918e}.tg{fill:#8fd1bd}.tc{fill:#e8a77f}.tb{fill:#a9c7e8}.tw{fill:#0f1214}
.bg{fill:#161a1d;stroke:#2a3033}.bgk{fill:#161a1d}.box{fill:#1b2023;stroke:#3a4245}.gray{fill:#20262a;stroke:#3a4245}.sep{stroke:#2a3033}
.green{fill:#142420;stroke:#4f9e88}.clay{fill:#2a1c14;stroke:#c97c4f}.blue{fill:#16202b;stroke:#6f93bb}
.fg{fill:#5fb39c}.fc{fill:#d9895a}.fb{fill:#7fa3c9}.fn{fill:#4a5155}
.zone{stroke:#3d7a6a}.zonec{stroke:#8a5a3a}
.ln{stroke:#7d858a}.lgn{stroke:#5fb39c}.lcl{stroke:#d9895a}.lbl{stroke:#7fa3c9}
.an{fill:#7d858a}.ag{fill:#5fb39c}.ac{fill:#d9895a}.ab{fill:#7fa3c9}
.ig{stroke:#8fd1bd}.ic{stroke:#e8a77f}.ib{stroke:#a9c7e8}.in{stroke:#b4bab7}
}
</style>
<defs>
<marker id="an" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5 z" class="an"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5 z" class="ag"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5 z" class="ac"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5 z" class="ab"/></marker>
</defs>

<rect class="bg" x="0.5" y="0.5" width="759" height="371" rx="14"/>

<!-- loopback -->
<rect class="box" x="20" y="20" width="352" height="136" rx="12"/>
<text class="s h" x="36" y="46">Loopback (the default)</text>
<rect class="gray" x="270" y="32" width="86" height="20" rx="10"/>
<text class="xs h t2" x="313" y="46" text-anchor="middle">auth: none</text>
<rect class="blue" x="36" y="66" width="92" height="36" rx="8"/>
<text class="s" x="82" y="88" text-anchor="middle">MCP client</text>
<path class="ln" d="M129,84 H195" marker-end="url(#an)"/>
<text class="xs t2" x="162" y="77" text-anchor="middle">loopback</text>
<rect class="green" x="198" y="66" width="158" height="36" rx="8"/>
<text class="s h tg" x="212" y="81">memors-mcp</text>
<text class="xs mono t2" x="212" y="96">--http 127.0.0.1</text>
<text class="xs t2" x="36" y="126">Only this machine can connect.</text>
<text class="xs t2" x="36" y="141">--auth token also keeps other OS users out.</text>

<!-- behind a proxy -->
<rect class="box" x="388" y="20" width="352" height="136" rx="12"/>
<text class="s h" x="404" y="46">Behind a reverse proxy</text>
<rect class="green" x="638" y="32" width="86" height="20" rx="10"/>
<text class="xs h tg" x="681" y="46" text-anchor="middle">auth: token</text>
<rect class="blue" x="404" y="66" width="76" height="36" rx="8"/>
<text class="s" x="442" y="88" text-anchor="middle">MCP client</text>
<path class="ln" d="M481,84 H503" marker-end="url(#an)"/>
<text class="xs t2" x="493" y="62" text-anchor="middle">https</text>
<rect class="gray" x="506" y="66" width="78" height="36" rx="8"/>
<text class="s h" x="545" y="81" text-anchor="middle">proxy</text>
<text class="xs t2" x="545" y="96" text-anchor="middle">Caddy, nginx</text>
<path class="ln" d="M585,84 H607" marker-end="url(#an)"/>
<text class="xs t2" x="597" y="62" text-anchor="middle">http</text>
<rect class="green" x="610" y="66" width="114" height="36" rx="8"/>
<text class="s h tg" x="622" y="81">memors-mcp</text>
<text class="xs mono t2" x="622" y="96">--behind-proxy</text>
<text class="xs t2" x="404" y="126">TLS ends at the proxy, which forwards to a</text>
<text class="xs t2" x="404" y="141">loopback --http. Needs --public-url.</text>

<!-- remote, tls -->
<rect class="box" x="20" y="172" width="352" height="136" rx="12"/>
<text class="s h" x="36" y="198">Remote, TLS on the server</text>
<rect class="green" x="270" y="184" width="86" height="20" rx="10"/>
<text class="xs h tg" x="313" y="198" text-anchor="middle">auth: token</text>
<rect class="blue" x="36" y="218" width="92" height="36" rx="8"/>
<text class="s" x="82" y="240" text-anchor="middle">MCP client</text>
<path class="ln" d="M129,236 H195" marker-end="url(#an)"/>
<text class="xs t2" x="162" y="229" text-anchor="middle">https</text>
<rect class="green" x="198" y="218" width="158" height="36" rx="8"/>
<text class="s h tg" x="212" y="233">memors-mcp</text>
<text class="xs mono t2" x="212" y="248">--allow-remote</text>
<text class="xs t2" x="36" y="278">Needs --tls-cert, --tls-key and --public-url.</text>
<text class="xs t2" x="36" y="293">Plain HTTP is refused.</text>

<!-- mtls -->
<rect class="box" x="388" y="172" width="352" height="136" rx="12"/>
<text class="s h" x="404" y="198">Mutual TLS</text>
<rect class="green" x="600" y="184" width="124" height="20" rx="10"/>
<text class="xs h tg" x="662" y="198" text-anchor="middle">auth: token or none</text>
<rect class="blue" x="404" y="218" width="110" height="36" rx="8"/>
<text class="s" x="418" y="233">MCP client</text>
<text class="xs t2" x="418" y="248">+ certificate</text>
<path class="ln" d="M515,236 H581" marker-end="url(#an)"/>
<text class="xs t2" x="548" y="229" text-anchor="middle">https</text>
<rect class="green" x="584" y="218" width="140" height="36" rx="8"/>
<text class="s h tg" x="598" y="233">memors-mcp</text>
<text class="xs mono t2" x="598" y="248">--tls-client-ca</text>
<text class="xs t2" x="404" y="278">Clients present a certificate signed by that CA;</text>
<text class="xs t2" x="404" y="293">the token is optional on top.</text>

<!-- refused -->
<rect class="clay" x="20" y="324" width="720" height="30" rx="10"/>
<path class="ic" d="M36,333 l11,11 M47,333 l-11,11"/>
<text class="xs t2" x="58" y="343">Refused at start: exposing the knowledge base without authentication, or sending the token unencrypted.</text>
</svg>
