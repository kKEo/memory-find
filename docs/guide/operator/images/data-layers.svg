<svg xmlns="http://www.w3.org/2000/svg" width="760" height="408" viewBox="0 0 760 408" role="img" aria-labelledby="t d">
<title id="t">The layers of one knowledge base</title>
<desc id="d">Six layers in one SQLite file. L5 pages, written by agents, cite passages. L4 graph mentions link entities to passages. L3 facts carry an evidence passage. L2 chunks are passages of one document revision, indexed by two FTS5 indexes and vectors. L1 documents are revisions of an L0 source. L0 to L2 and L4 can be rebuilt; L3 facts and L5 pages are kept. Bookkeeping tables sit beside the layers.</desc>
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#171a1f}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.h{font-weight:600}.lg{font-size:14px}.s{font-size:12px}.xs{font-size:11px}.cap{font-size:10.5px;font-weight:600;letter-spacing:.08em}
.t2{fill:#4a4f57}.t3{fill:#6d727a}.tg{fill:#1f5c4f}.tc{fill:#8a4a24}.tb{fill:#36577a}.tw{fill:#fff}
.bg{fill:#faf8f4;stroke:#e4e0d8}.bgk{fill:#faf8f4}.box{fill:#fff;stroke:#d3cec4}.gray{fill:#f3f0ea;stroke:#d3cec4}.sep{fill:none;stroke:#e4e0d8}
.green{fill:#eef5f2;stroke:#3b8572}.clay{fill:#fbf1ea;stroke:#a85a2c}.blue{fill:#eef3f8;stroke:#5b7ea3}
.fg{fill:#3b8572}.fc{fill:#b8693a}.fb{fill:#5b7ea3}.fn{fill:#c4c8cc}
.zone{fill:none;stroke:#7fb3a3;stroke-width:1.5;stroke-dasharray:6 5}.zonec{fill:none;stroke:#d0a080;stroke-width:1.5;stroke-dasharray:6 5}
.ln{fill:none;stroke:#8a8f96;stroke-width:1.5}.lgn{fill:none;stroke:#3b8572;stroke-width:1.5}.lcl{fill:none;stroke:#a85a2c;stroke-width:1.5}.lbl{fill:none;stroke:#5b7ea3;stroke-width:1.5}
.dash{stroke-dasharray:4 4}
.an{fill:#8a8f96}.ag{fill:#3b8572}.ac{fill:#a85a2c}.ab{fill:#5b7ea3}
.ig,.ic,.ib,.in{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ig{stroke:#1f5c4f}.ic{stroke:#a85a2c}.ib{stroke:#36577a}.in{stroke:#4a4f57}
@media (prefers-color-scheme:dark){
text{fill:#eceeec}
.t2{fill:#b4bab7}.t3{fill:#8a918e}.tg{fill:#8fd1bd}.tc{fill:#e8a77f}.tb{fill:#a9c7e8}.tw{fill:#0f1214}
.bg{fill:#161a1d;stroke:#2a3033}.bgk{fill:#161a1d}.box{fill:#1b2023;stroke:#3a4245}.gray{fill:#20262a;stroke:#3a4245}.sep{stroke:#2a3033}
.green{fill:#142420;stroke:#4f9e88}.clay{fill:#2a1c14;stroke:#c97c4f}.blue{fill:#16202b;stroke:#6f93bb}
.fg{fill:#5fb39c}.fc{fill:#d9895a}.fb{fill:#7fa3c9}.fn{fill:#4a5155}
.zone{stroke:#3d7a6a}.zonec{stroke:#8a5a3a}
.ln{stroke:#7d858a}.lgn{stroke:#5fb39c}.lcl{stroke:#d9895a}.lbl{stroke:#7fa3c9}
.an{fill:#7d858a}.ag{fill:#5fb39c}.ac{fill:#d9895a}.ab{fill:#7fa3c9}
.ig{stroke:#8fd1bd}.ic{stroke:#e8a77f}.ib{stroke:#a9c7e8}.in{stroke:#b4bab7}
}
</style>
<defs>
<marker id="an" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5 z" class="an"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5 z" class="ag"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5 z" class="ac"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5 z" class="ab"/></marker>
</defs>

<rect class="bg" x="0.5" y="0.5" width="759" height="407" rx="14"/>

<text class="cap t3" x="24" y="28">LAYER</text>
<text class="cap t3" x="72" y="28">WHAT IT HOLDS</text>
<text class="cap t3" x="624" y="28">REBUILD?</text>

<!-- L5 -->
<text class="cap t3" x="28" y="66">L5</text>
<rect class="box" x="72" y="40" width="480" height="42" rx="8"/>
<text class="h" x="86" y="58">pages</text>
<text class="xs t2" x="86" y="74">markdown an agent wrote; cites the passages it was built from</text>
<rect class="clay" x="624" y="40" width="112" height="42" rx="8"/>
<text class="s h tc" x="680" y="58" text-anchor="middle">kept</text>
<text class="xs t2" x="680" y="73" text-anchor="middle">written by agents</text>

<!-- L4 -->
<text class="cap t3" x="28" y="118">L4</text>
<rect class="box" x="72" y="92" width="480" height="42" rx="8"/>
<text class="h" x="86" y="110">graph</text>
<text class="xs t2" x="86" y="126">entities and aliases; mentions link them to passages; merge candidates</text>
<rect class="green" x="624" y="92" width="112" height="42" rx="8"/>
<text class="s h tg" x="680" y="110" text-anchor="middle">rebuildable</text>
<text class="xs mono t2" x="680" y="125" text-anchor="middle">graph rebuild</text>

<!-- L3 -->
<text class="cap t3" x="28" y="170">L3</text>
<rect class="box" x="72" y="144" width="480" height="42" rx="8"/>
<text class="h" x="86" y="162">facts</text>
<text class="xs t2" x="86" y="178">one-sentence claims with a validity window and an evidence passage</text>
<rect class="clay" x="624" y="144" width="112" height="42" rx="8"/>
<text class="s h tc" x="680" y="162" text-anchor="middle">kept</text>
<text class="xs t2" x="680" y="177" text-anchor="middle">additive history</text>

<!-- L2 -->
<text class="cap t3" x="28" y="222">L2</text>
<rect class="box" x="72" y="196" width="480" height="42" rx="8"/>
<text class="h" x="86" y="214">chunks</text>
<text class="xs t2" x="86" y="230">passages of ~200 tokens, indexed three ways: two FTS5 indexes + vectors</text>

<!-- L1 -->
<text class="cap t3" x="28" y="274">L1</text>
<rect class="box" x="72" y="248" width="480" height="42" rx="8"/>
<text class="h" x="86" y="266">documents</text>
<text class="xs t2" x="86" y="282">the text as ingested, one row per revision</text>

<!-- L0 -->
<text class="cap t3" x="28" y="326">L0</text>
<rect class="box" x="72" y="300" width="480" height="42" rx="8"/>
<text class="h" x="86" y="318">sources</text>
<text class="xs t2" x="86" y="334">where it came from: URI or file, library, version, hash, trust, origin</text>

<rect class="green" x="624" y="196" width="112" height="146" rx="8"/>
<text class="s h tg" x="680" y="262" text-anchor="middle">rebuildable</text>
<text class="xs t2" x="680" y="278" text-anchor="middle">from the sources</text>

<!-- points down to what it came from -->
<path class="ln" d="M552,165 H570 V206 H556" marker-end="url(#an)"/>
<path class="ln" d="M552,113 H586 V216 H556" marker-end="url(#an)"/>
<path class="ln" d="M552,61 H602 V226 H556" marker-end="url(#an)"/>
<path class="ln" d="M552,232 H570 V269 H556" marker-end="url(#an)"/>
<path class="ln" d="M552,280 H570 V321 H556" marker-end="url(#an)"/>

<!-- bookkeeping -->
<rect class="gray" x="72" y="356" width="480" height="32" rx="8" style="stroke-dasharray:4 4"/>
<text class="s h t2" x="86" y="377">bookkeeping</text>
<text class="xs t3" x="182" y="377">namespaces, models, jobs, audit, query_log, call_log</text>
<text class="xs t3" x="624" y="377">→ traces back to</text>
</svg>
