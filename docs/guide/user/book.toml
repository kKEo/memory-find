# Read by mdBook in CI (make docs); GitBook ignores this file.
[book]
title = "memo-mcp user guide"
description = "A memory your AI assistant can show its work from: what it is, why it helps, and how to use it."
authors = ["memo-mcp contributors"]
language = "en"
src = "."

[build]
build-dir = "../../../site/user"
create-missing = false

[output.html]
git-repository-url = "https://github.com/kKEo/memory-find"
edit-url-template = "https://github.com/kKEo/memory-find/edit/master/docs/guide/user/{path}"
site-url = "/memory-find/user/"

[output.html.search]
enable = true
