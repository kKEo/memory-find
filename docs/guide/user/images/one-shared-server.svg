<svg xmlns="http://www.w3.org/2000/svg" width="760" height="312" viewBox="0 0 760 312" role="img" aria-labelledby="t d">
<title id="t">A copy per session, or one shared server</title>
<desc id="d">Usually Claude Code starts its own copy of memors-mcp for each session, and every copy opens the same memory file. Optionally you run one memors-mcp server yourself at 127.0.0.1:8765; every session connects to it, and your browser shows its Live page.</desc>
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#171a1f}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.h{font-weight:600}.lg{font-size:14px}.s{font-size:12px}.xs{font-size:11px}.cap{font-size:10.5px;font-weight:600;letter-spacing:.08em}
.t2{fill:#4a4f57}.t3{fill:#6d727a}.tg{fill:#1f5c4f}.tc{fill:#8a4a24}.tb{fill:#36577a}.tw{fill:#fff}
.bg{fill:#faf8f4;stroke:#e4e0d8}.bgk{fill:#faf8f4}.box{fill:#fff;stroke:#d3cec4}.gray{fill:#f3f0ea;stroke:#d3cec4}.sep{fill:none;stroke:#e4e0d8}
.green{fill:#eef5f2;stroke:#3b8572}.clay{fill:#fbf1ea;stroke:#a85a2c}.blue{fill:#eef3f8;stroke:#5b7ea3}
.fg{fill:#3b8572}.fc{fill:#b8693a}.fb{fill:#5b7ea3}.fn{fill:#c4c8cc}
.zone{fill:none;stroke:#7fb3a3;stroke-width:1.5;stroke-dasharray:6 5}.zonec{fill:none;stroke:#d0a080;stroke-width:1.5;stroke-dasharray:6 5}
.ln{fill:none;stroke:#8a8f96;stroke-width:1.5}.lgn{fill:none;stroke:#3b8572;stroke-width:1.5}.lcl{fill:none;stroke:#a85a2c;stroke-width:1.5}.lbl{fill:none;stroke:#5b7ea3;stroke-width:1.5}
.dash{stroke-dasharray:4 4}
.an{fill:#8a8f96}.ag{fill:#3b8572}.ac{fill:#a85a2c}.ab{fill:#5b7ea3}
.ig,.ic,.ib,.in{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ig{stroke:#1f5c4f}.ic{stroke:#a85a2c}.ib{stroke:#36577a}.in{stroke:#4a4f57}
@media (prefers-color-scheme:dark){
text{fill:#eceeec}
.t2{fill:#b4bab7}.t3{fill:#8a918e}.tg{fill:#8fd1bd}.tc{fill:#e8a77f}.tb{fill:#a9c7e8}.tw{fill:#0f1214}
.bg{fill:#161a1d;stroke:#2a3033}.bgk{fill:#161a1d}.box{fill:#1b2023;stroke:#3a4245}.gray{fill:#20262a;stroke:#3a4245}.sep{stroke:#2a3033}
.green{fill:#142420;stroke:#4f9e88}.clay{fill:#2a1c14;stroke:#c97c4f}.blue{fill:#16202b;stroke:#6f93bb}
.fg{fill:#5fb39c}.fc{fill:#d9895a}.fb{fill:#7fa3c9}.fn{fill:#4a5155}
.zone{stroke:#3d7a6a}.zonec{stroke:#8a5a3a}
.ln{stroke:#7d858a}.lgn{stroke:#5fb39c}.lcl{stroke:#d9895a}.lbl{stroke:#7fa3c9}
.an{fill:#7d858a}.ag{fill:#5fb39c}.ac{fill:#d9895a}.ab{fill:#7fa3c9}
.ig{stroke:#8fd1bd}.ic{stroke:#e8a77f}.ib{stroke:#a9c7e8}.in{stroke:#b4bab7}
}
</style>
<defs>
<marker id="an" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5 z" class="an"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5 z" class="ag"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5 z" class="ac"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5 z" class="ab"/></marker>
</defs>

<rect class="bg" x="0.5" y="0.5" width="759" height="311" rx="14"/>

<!-- usual: a copy per session -->
<rect class="box" x="20" y="20" width="354" height="272" rx="12"/>
<text class="cap t3" x="40" y="46">USUAL: A COPY FOR EACH SESSION</text>

<rect class="blue" x="40" y="64" width="90" height="36" rx="9"/>
<text class="s" x="85" y="86" text-anchor="middle">Claude Code</text>
<rect class="blue" x="152" y="64" width="90" height="36" rx="9"/>
<text class="s" x="197" y="86" text-anchor="middle">Claude Code</text>
<rect class="blue" x="264" y="64" width="90" height="36" rx="9"/>
<text class="s" x="309" y="86" text-anchor="middle">Claude Code</text>

<path class="ln" d="M85,101 V123" marker-end="url(#an)"/>
<path class="ln" d="M197,101 V123" marker-end="url(#an)"/>
<path class="ln" d="M309,101 V123" marker-end="url(#an)"/>

<rect class="green" x="40" y="126" width="90" height="32" rx="9"/>
<text class="s h tg" x="85" y="146" text-anchor="middle">memors-mcp</text>
<rect class="green" x="152" y="126" width="90" height="32" rx="9"/>
<text class="s h tg" x="197" y="146" text-anchor="middle">memors-mcp</text>
<rect class="green" x="264" y="126" width="90" height="32" rx="9"/>
<text class="s h tg" x="309" y="146" text-anchor="middle">memors-mcp</text>

<path class="ln" d="M85,159 L172,210" marker-end="url(#an)"/>
<path class="ln" d="M197,159 V210" marker-end="url(#an)"/>
<path class="ln" d="M309,159 L222,210" marker-end="url(#an)"/>

<rect class="gray" x="142" y="214" width="110" height="42" rx="9"/>
<text class="s h" x="197" y="232" text-anchor="middle">Memory file</text>
<text class="xs mono t2" x="197" y="248" text-anchor="middle">my-project.db</text>

<text class="xs t2" x="197" y="278" text-anchor="middle">Claude Code starts and stops a copy per session</text>

<!-- optional: one shared server -->
<rect class="box" x="386" y="20" width="354" height="272" rx="12"/>
<text class="cap tg" x="406" y="46">OPTIONAL: ONE SHARED SERVER</text>

<rect class="blue" x="406" y="64" width="90" height="36" rx="9"/>
<text class="s" x="451" y="86" text-anchor="middle">Claude Code</text>
<rect class="blue" x="518" y="64" width="90" height="36" rx="9"/>
<text class="s" x="563" y="86" text-anchor="middle">Claude Code</text>
<rect class="blue" x="630" y="64" width="90" height="36" rx="9"/>
<text class="s" x="675" y="86" text-anchor="middle">Claude Code</text>

<path class="ln" d="M451,101 L520,126" marker-end="url(#an)"/>
<path class="ln" d="M563,101 V126" marker-end="url(#an)"/>
<path class="ln" d="M675,101 L606,126" marker-end="url(#an)"/>

<rect class="green" x="463" y="130" width="200" height="48" rx="10"/>
<text class="s h mono tg" x="563" y="150" text-anchor="middle">memors-mcp serve --http</text>
<text class="xs mono t2" x="563" y="167" text-anchor="middle">127.0.0.1:8765</text>

<path class="ln" d="M485,179 V210" marker-end="url(#an)"/>
<path class="ln" d="M651,213 V182" marker-end="url(#an)"/>

<rect class="gray" x="430" y="214" width="110" height="42" rx="9"/>
<text class="s h" x="485" y="232" text-anchor="middle">Memory file</text>
<text class="xs mono t2" x="485" y="248" text-anchor="middle">my-project.db</text>

<rect class="gray" x="586" y="214" width="130" height="42" rx="9"/>
<text class="s h" x="651" y="232" text-anchor="middle">Live page</text>
<text class="xs t2" x="651" y="248" text-anchor="middle">in your browser</text>

<text class="xs t2" x="563" y="278" text-anchor="middle">You start it once; every session connects to it</text>
</svg>
