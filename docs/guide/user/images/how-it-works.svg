<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="t d">
<title id="t">How memo-mcp fits in</title>
<desc id="d">You tell and ask Claude. Claude saves to and searches memo-mcp, which keeps everything in one memory file on your computer. Every result comes back with where it came from, who vouched for it, when it was saved and how strong the match is.</desc>
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#171a1f}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.h{font-weight:600}.lg{font-size:14px}.s{font-size:12px}.xs{font-size:11px}.cap{font-size:10.5px;font-weight:600;letter-spacing:.08em}
.t2{fill:#4a4f57}.t3{fill:#6d727a}.tg{fill:#1f5c4f}.tc{fill:#8a4a24}.tb{fill:#36577a}.tw{fill:#fff}
.bg{fill:#faf8f4;stroke:#e4e0d8}.bgk{fill:#faf8f4}.box{fill:#fff;stroke:#d3cec4}.gray{fill:#f3f0ea;stroke:#d3cec4}.sep{fill:none;stroke:#e4e0d8}
.green{fill:#eef5f2;stroke:#3b8572}.clay{fill:#fbf1ea;stroke:#a85a2c}.blue{fill:#eef3f8;stroke:#5b7ea3}
.fg{fill:#3b8572}.fc{fill:#b8693a}.fb{fill:#5b7ea3}.fn{fill:#c4c8cc}
.zone{fill:none;stroke:#7fb3a3;stroke-width:1.5;stroke-dasharray:6 5}.zonec{fill:none;stroke:#d0a080;stroke-width:1.5;stroke-dasharray:6 5}
.ln{fill:none;stroke:#8a8f96;stroke-width:1.5}.lgn{fill:none;stroke:#3b8572;stroke-width:1.5}.lcl{fill:none;stroke:#a85a2c;stroke-width:1.5}.lbl{fill:none;stroke:#5b7ea3;stroke-width:1.5}
.dash{stroke-dasharray:4 4}
.an{fill:#8a8f96}.ag{fill:#3b8572}.ac{fill:#a85a2c}.ab{fill:#5b7ea3}
.ig,.ic,.ib,.in{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ig{stroke:#1f5c4f}.ic{stroke:#a85a2c}.ib{stroke:#36577a}.in{stroke:#4a4f57}
@media (prefers-color-scheme:dark){
text{fill:#eceeec}
.t2{fill:#b4bab7}.t3{fill:#8a918e}.tg{fill:#8fd1bd}.tc{fill:#e8a77f}.tb{fill:#a9c7e8}.tw{fill:#0f1214}
.bg{fill:#161a1d;stroke:#2a3033}.bgk{fill:#161a1d}.box{fill:#1b2023;stroke:#3a4245}.gray{fill:#20262a;stroke:#3a4245}.sep{stroke:#2a3033}
.green{fill:#142420;stroke:#4f9e88}.clay{fill:#2a1c14;stroke:#c97c4f}.blue{fill:#16202b;stroke:#6f93bb}
.fg{fill:#5fb39c}.fc{fill:#d9895a}.fb{fill:#7fa3c9}.fn{fill:#4a5155}
.zone{stroke:#3d7a6a}.zonec{stroke:#8a5a3a}
.ln{stroke:#7d858a}.lgn{stroke:#5fb39c}.lcl{stroke:#d9895a}.lbl{stroke:#7fa3c9}
.an{fill:#7d858a}.ag{fill:#5fb39c}.ac{fill:#d9895a}.ab{fill:#7fa3c9}
.ig{stroke:#8fd1bd}.ic{stroke:#e8a77f}.ib{stroke:#a9c7e8}.in{stroke:#b4bab7}
}
</style>
<defs>
<marker id="an" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5 z" class="an"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5 z" class="ag"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5 z" class="ac"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5 z" class="ab"/></marker>
</defs>

<rect class="bg" x="0.5" y="0.5" width="759" height="299" rx="14"/>

<!-- on your computer -->
<rect class="zone" x="484" y="22" width="252" height="162" rx="14"/>
<text class="cap tg" x="500" y="43">ON YOUR COMPUTER</text>
<text class="xs t3" x="610" y="173" text-anchor="middle">Nothing is sent to a cloud service</text>

<!-- you -->
<rect class="clay" x="24" y="64" width="104" height="88" rx="12"/>
<circle class="ic" cx="76" cy="87" r="8"/>
<path class="ic" d="M61,111 c0,-9 7,-14 15,-14 s15,5 15,14"/>
<text class="h lg" x="76" y="134" text-anchor="middle">You</text>

<!-- claude -->
<rect class="blue" x="256" y="64" width="116" height="88" rx="12"/>
<path class="ib" d="M303,79 h22 a4,4 0 0 1 4,4 v11 a4,4 0 0 1 -4,4 h-12 l-6,6 v-6 h-4 a4,4 0 0 1 -4,-4 v-11 a4,4 0 0 1 4,-4 z"/>
<path class="ib" d="M306,86 h16 M306,91 h10"/>
<text class="h lg" x="314" y="127" text-anchor="middle">Claude</text>
<text class="xs t2" x="314" y="143" text-anchor="middle">Code or Desktop</text>

<!-- memo-mcp -->
<rect class="green" x="500" y="64" width="96" height="88" rx="12"/>
<circle class="ig" cx="545" cy="87" r="8"/>
<path class="ig" d="M551,93 l7,7"/>
<text class="h lg tg" x="548" y="127" text-anchor="middle">memo-mcp</text>
<text class="xs t2" x="548" y="143" text-anchor="middle">saves &amp; finds</text>

<!-- memory file -->
<rect class="box" x="624" y="64" width="96" height="88" rx="12"/>
<ellipse class="in" cx="672" cy="81" rx="12" ry="4.5"/>
<path class="in" d="M660,81 v17 c0,2.5 5.4,4.5 12,4.5 s12,-2 12,-4.5 v-17 M660,89.5 c0,2.5 5.4,4.5 12,4.5 s12,-2 12,-4.5"/>
<text class="h" x="672" y="127" text-anchor="middle">Memory file</text>
<text class="mono xs t2" x="672" y="143" text-anchor="middle">my-project.db</text>

<!-- arrows -->
<path class="ln" d="M130,92 H252" marker-end="url(#an)"/>
<text class="s t2" x="192" y="84" text-anchor="middle">tells &amp; asks</text>
<path class="ln" d="M254,124 H132" marker-end="url(#an)"/>
<text class="s t2" x="192" y="142" text-anchor="middle">answers + sources</text>

<path class="ln" d="M374,92 H496" marker-end="url(#an)"/>
<text class="s t2" x="436" y="84" text-anchor="middle">save · search</text>
<path class="ln" d="M498,124 H376" marker-end="url(#an)"/>
<text class="s t2" x="436" y="142" text-anchor="middle">results</text>
<text class="s t2" x="436" y="157" text-anchor="middle">with receipts</text>

<path class="ln" d="M599,108 H621" marker-start="url(#an)" marker-end="url(#an)"/>

<!-- receipt -->
<path class="ln dash" d="M436,164 V196"/>
<rect class="box" x="24" y="196" width="712" height="84" rx="12"/>
<text class="cap t3" x="44" y="218">EVERY RESULT CARRIES</text>
<text class="h" x="44" y="243">Where it came from</text>
<text class="s t2" x="44" y="261">document, passage, link</text>
<path class="sep" d="M206.5,230 V268"/>
<text class="h" x="222" y="243">Who vouched for it</text>
<text class="s t2" x="222" y="261">you, Claude, or checked</text>
<path class="sep" d="M384.5,230 V268"/>
<text class="h" x="400" y="243">When it was saved</text>
<text class="s t2" x="400" y="261">and if a newer one exists</text>
<path class="sep" d="M562.5,230 V268"/>
<text class="h" x="578" y="243">How strong the match</text>
<text class="s t2" x="578" y="261">strong · moderate · weak</text>
</svg>
