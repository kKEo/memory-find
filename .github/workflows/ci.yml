# Minimal CI (roadmap P0). The full three-OS matrix, lint-as-gate and the
# release pipeline arrive in P6. PR CI never downloads an embedding model:
# every test runs against the deterministic HashEmbedder.
name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: test (race)
        run: go test ./... -race -count=1
      - name: build (pure Go)
        run: CGO_ENABLED=0 go build -ldflags "-X main.version=$(git describe --tags --always)" -o memo-mcp ./cmd/memo-mcp
      - name: smoke
        run: ./memo-mcp version
